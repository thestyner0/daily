<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="theme-color" content="#f5f2ec">
<title>Daily</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f2ec;--paper:#fffdf9;--ink:#1d1a17;--muted:#6f685f;--line:#e6dfd4;--accent:#9a4a12}
@media (prefers-color-scheme:dark){:root{--bg:#141318;--paper:#1e1c23;--ink:#ece7df;--muted:#a39b90;--line:#34303b;--accent:#f0a560}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:320px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
h1{margin:0 0 4px;font-size:20px}p{margin:0 0 14px;color:var(--muted);font-size:13px}
input[type=password]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font-size:18px;letter-spacing:.2em;text-align:center}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:12px 0}
button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:700}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
<form id="f" autocomplete="off">
<h1>Daily</h1><p>식단 · 주차 · 볼거리 · 핫플</p>
<input type="password" id="pw" inputmode="numeric" placeholder="비밀번호" autofocus>
<label><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
<button type="submit">열기</button>
<div class="err" id="err"></div>
</form>
</div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const r=await fetch('app.enc?t='+Date.now(),{cache:'no-store'}).catch(()=>fetch('app.enc'));
  const j=await r.json();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.salt),iterations:j.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
async function tryOpen(pw,remember){
  const html=await decrypt(pw);
  try{remember?localStorage.setItem('daily.pw',pw):localStorage.removeItem('daily.pw')}catch(e){}
  show(html);
}
(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let saved=null;try{saved=localStorage.getItem('daily.pw')}catch(e){}
  if(saved){try{await tryOpen(saved,true);return}catch(e){}}
  document.getElementById('gate').hidden=false;
  document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const err=document.getElementById('err');err.textContent='';
    try{await tryOpen(document.getElementById('pw').value,document.getElementById('rem').checked)}catch(e){err.textContent='비밀번호가 맞지 않습니다.'}};
})();
</script>
</body>
</html>
